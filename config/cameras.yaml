globals:
  vision_pipeline: gate
  # HuggingFace model for oLmOCR (overridden by env OCR_MODEL). FP8 variant uses less VRAM on Jetson.
  ocr_model_name: "Qwen/Qwen2-VL-2B-Instruct"
  use_gstreamer: false  # USB cameras don't use GStreamer (only RTSP streams do)
  detector_conf: 0.20  # Detection confidence threshold (lowered to detect more trailers)
  detect_every_n: 3     # Run detector every N frames — set low for maximum trailer coverage
  save_frames: true    # Save screenshots
  keep_screenshots: 10 # Keep last N screenshots per camera

  # Image preprocessing configuration
  preprocessing:
    enable_yolo: false      # Enable preprocessing for YOLO detection
    enable_ocr: true       # Enable preprocessing for OCR recognition
    yolo_strategy: "enhanced"  # YOLO strategy: "none", "basic", "enhanced"
    ocr_strategy: "realworld"  # OCR strategy: "none", "morphological", "clahe", "adaptive", "multi", "realworld"

  # ---- Prosper Smart Yard upload -------------------------------------------------
  # The edge uploads YardVision and GateVision results to:
  #   POST {prosper_api_base_url}/api/sites/{prosper_site_id}/locations/trailers
  #   POST {prosper_api_base_url}/api/sites/{prosper_site_id}/gate-events
  #
  # Auth (recommended NEW flow — auto-refresh):
  #   Set the LOGIN TRIPLE in environment variables and the edge will call
  #   POST {base}/api/auth/login automatically, cache the JWT, and re-login
  #   on the next request after a 401/403 (i.e. when a token expires).
  #     export PROSPER_SITE_CODE="CHANDLER"
  #     export PROSPER_EMAIL="admin@prosperdemo.local"
  #     export PROSPER_PASSWORD="..."          # never read from this YAML
  #   Optional:
  #     export PROSPER_BEARER_TOKEN="..."      # used as the initial cached token;
  #                                            # once expired, auto-refresh takes over.
  #
  # Legacy / one-off testing:
  #   Set PROSPER_BEARER_TOKEN alone (no auto-refresh) or DASHBOARD_API_KEY /
  #   PROSPER_API_KEY (X-API-Key header). These still work but you'll have to
  #   replace the token by hand when it expires.
  #
  # prosper_api_base_url: "https://syapi.prosperassettracking.com"
  # prosper_site_id: "11111111-1111-1111-1111-111111111111"
  # prosper_site_code: "CHANDLER"   # also overridable by env PROSPER_SITE_CODE
  # prosper_email: "admin@prosperdemo.local"   # also overridable by env PROSPER_EMAIL
  prosper_gate_id_map:
    gate-1: "66666666-6666-6666-6666-666666666661"

stacker_vision:
  detector_model: "models/stacker_yolov8n.pt"
  detector_conf: 0.40
  detect_every_n: 1
  tier_calibration:
    method: "cabin_view"           # Cabin view angle (inside windshield looking forward/up)
    hood_line_ratio: 0.75         # Vehicle bonnet height ratio
    spreader_real_height_m: 0.45
    container_real_height_m: 2.591
    high_cube_height_m: 2.896
    tier_thresholds_px: [550, 420, 300, 180, 100]
  state_machine:
    alignment_iou_thresh: 0.3
    co_motion_max_delta_px: 15
    co_motion_min_frames: 5
    ground_gap_min_px: 20
    release_still_frames: 10
    approach_distance_px: 200

gatevision:
  fusion_window_seconds: 3.0
  finalize_after_seconds: 1.5
  min_roles_required: 1
  confirm_conf_threshold: 0.50  # Lowered to match ocr_min_confidence for maximum recall
  ocr_run_every_n_frames: 6
  ocr_cache_max_age: 25
  ocr_min_confidence: 0.50
  max_recent_events: 80
  enable_auto_close_on_departure: true
  enable_damage_comparison: false

cameras:
  # --- GATE IN (Inbound Lanes) ---
  - id: gate-in-01
    name: "Gate IN - Front Camera"
    rtsp_url: "rtsp://admin:admin@192.168.1.155:554/cam/realmonitor?channel=1&subtype=1"
    width: 1280
    height: 720
    fps_cap: 25
    role: gate_in_front
    gate_id: gate-in
    direction: INBOUND

  - id: gate-in-02
    name: "Gate IN - Rear Camera"
    rtsp_url: "rtsp://admin:admin@192.168.1.155:554/cam/realmonitor?channel=1&subtype=1"
    width: 1280
    height: 720
    fps_cap: 25
    role: gate_in_rear
    gate_id: gate-in
    direction: INBOUND

  # --- GATE OUT (Outbound Lanes) ---
  - id: gate-out-01
    name: "Gate OUT - Front Camera"
    rtsp_url: "rtsp://admin:admin@192.168.1.157:554/cam/realmonitor?channel=1&subtype=1"
    width: 1280
    height: 720
    fps_cap: 25
    role: gate_out_front
    gate_id: gate-out
    direction: OUTBOUND

  - id: gate-out-02
    name: "Gate OUT - Rear Camera"
    rtsp_url: "rtsp://admin:admin@192.168.1.158:554/cam/realmonitor?channel=1&subtype=1"
    width: 1280
    height: 720
    fps_cap: 25
    role: gate_out_rear
    gate_id: gate-out
    direction: OUTBOUND

