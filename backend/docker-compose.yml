services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gate_module
      MYSQL_USER: gate
      MYSQL_PASSWORD: ${GATE_MYSQL_PASSWORD:?Set GATE_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${GATE_MYSQL_ROOT_PASSWORD:?Set GATE_MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - gate_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  gate_mysql:
